<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#141227"/>
      <stop offset="100%" stop-color="#2b1250"/>
    </linearGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16304f"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </linearGradient>
    <linearGradient id="hotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0a825"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="coldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b4fd1"/>
      <stop offset="100%" stop-color="#4a1f7a"/>
    </linearGradient>
    <marker id="hotArrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e0a825"/>
    </marker>
    <marker id="coldArrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b4fd1"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="url(#bgGrad2)"/>
  <g opacity="0.06">
    <pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff"/>
    </pattern>
    <rect width="1200" height="620" fill="url(#dots2)"/>
  </g>

  <text x="30" y="34" font-size="14" letter-spacing="2" fill="#e0a825" font-weight="700">BOUNDARY CONDITIONS SCHEMATIC</text>

  <!-- Adiabatic outline -->
  <rect x="228" y="188" width="744" height="224" rx="112" fill="none" stroke="#5a6b85" stroke-width="2" stroke-dasharray="8 8" opacity="0.8"/>
  <text x="600" y="172" font-size="14" fill="#8695ac" text-anchor="middle" font-style="italic">Adiabatic shell wall — no heat loss to surroundings</text>

  <!-- Shell body -->
  <rect x="250" y="210" width="700" height="180" rx="90" fill="url(#shellGrad)" stroke="url(#hotGrad)" stroke-width="3"/>

  <!-- Baffles: alternating segmental plates -->
  <g stroke="#c98a1288" stroke-width="2">
    <rect x="340" y="210" width="10" height="90" fill="#4a1f7a77"/>
    <rect x="440" y="300" width="10" height="90" fill="#4a1f7a77"/>
    <rect x="540" y="210" width="10" height="90" fill="#4a1f7a77"/>
    <rect x="640" y="300" width="10" height="90" fill="#4a1f7a77"/>
    <rect x="740" y="210" width="10" height="90" fill="#4a1f7a77"/>
    <rect x="840" y="300" width="10" height="90" fill="#4a1f7a77"/>
  </g>
  <text x="600" y="470" font-size="13" fill="#9fb0c7" text-anchor="middle">6 segmental baffles — alternating cut, 80 mm pitch</text>

  <!-- Tube bundle axis -->
  <line x1="250" y1="300" x2="950" y2="300" stroke="#e0a82555" stroke-width="4" stroke-dasharray="4 6"/>
  <text x="600" y="290" font-size="13" fill="#c9902a" text-anchor="middle">tube bundle centerline — 7 tubes</text>

  <!-- Hot inlet (top-left, shell side) -->
  <line x1="150" y1="120" x2="150" y2="205" stroke="url(#hotGrad)" stroke-width="5" marker-end="url(#hotArrow)"/>
  <line x1="150" y1="120" x2="330" y2="120" stroke="url(#hotGrad)" stroke-width="5"/>
  <line x1="330" y1="120" x2="330" y2="205" stroke="url(#hotGrad)" stroke-width="5" marker-end="url(#hotArrow)"/>
  <text x="150" y="95" font-size="15" fill="#e0a825" font-weight="700">Hot Inlet, Shell</text>
  <text x="150" y="115" font-size="13" fill="#c9902a">70.09 °C</text>

  <!-- Hot outlet (bottom-right, shell side) -->
  <line x1="870" y1="395" x2="870" y2="470" stroke="url(#hotGrad)" stroke-width="5" marker-end="url(#hotArrow)"/>
  <text x="870" y="495" font-size="15" fill="#e0a825" font-weight="700" text-anchor="middle">Hot Outlet, Shell</text>
  <text x="870" y="514" font-size="13" fill="#c9902a" text-anchor="middle">48.08 °C</text>

  <!-- Cold inlet (left end, tube side) -->
  <line x1="100" y1="300" x2="248" y2="300" stroke="url(#coldGrad)" stroke-width="5" marker-end="url(#coldArrow)"/>
  <text x="175" y="335" font-size="15" fill="#a06ee0" font-weight="700" text-anchor="middle">Cold Inlet</text>
  <text x="175" y="354" font-size="13" fill="#a06ee0" text-anchor="middle">25.29 °C</text>

  <!-- Cold outlet (right end, tube side) -->
  <line x1="952" y1="300" x2="1100" y2="300" stroke="url(#coldGrad)" stroke-width="5" marker-end="url(#coldArrow)"/>
  <text x="1025" y="335" font-size="15" fill="#a06ee0" font-weight="700" text-anchor="middle">Cold Outlet</text>
  <text x="1025" y="354" font-size="13" fill="#a06ee0" text-anchor="middle">47.45 °C</text>

  <!-- Flow rate caption -->
  <rect x="330" y="538" width="540" height="54" rx="10" fill="#12233daa" stroke="#e0a82555" stroke-width="1.5"/>
  <text x="600" y="570" font-size="14.5" fill="#e0a825" text-anchor="middle" font-weight="700">ṁ_hot = ṁ_cold = 0.5 kg/s</text>
  <text x="600" y="588" font-size="12.5" fill="#c9b280" text-anchor="middle">mass-flow inlets · 0 Pa gauge outlets</text>
</svg>
