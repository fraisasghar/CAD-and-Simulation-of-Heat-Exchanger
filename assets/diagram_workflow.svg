<svg viewBox="0 0 1680 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#131029"/>
      <stop offset="100%" stop-color="#2b1250"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132a47"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#5b2a8c"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a825"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#e0a825"/>
    </linearGradient>
  </defs>

  <rect width="1680" height="300" fill="url(#bgGrad)"/>

  <!-- subtle dot grid -->
  <g opacity="0.06">
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff"/>
    </pattern>
    <rect width="1680" height="300" fill="url(#dots)"/>
  </g>

  <text x="30" y="34" font-size="14" letter-spacing="2" fill="#e0a825" font-weight="700">CFD → VALIDATION PIPELINE</text>

  <!-- Nodes -->
  <!-- Node template repeated with computed x -->
  <g>
    <!-- Node 1 -->
    <g>
      <rect x="20" y="70" width="220" height="160" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
      <circle cx="50" cy="100" r="20" fill="url(#badgeGrad)"/>
      <text x="50" y="106" font-size="18" font-weight="700" fill="#0a1628" text-anchor="middle">1</text>
      <text x="30" y="150" font-size="21" font-weight="700" fill="#eef2f8">CAD Geometry</text>
      <text x="30" y="178" font-size="13" fill="#9fb0c7">Parametric shell,</text>
      <text x="30" y="197" font-size="13" fill="#9fb0c7">tube bundle &amp; baffles</text>
    </g>
    <!-- Arrow -->
    <line x1="245" y1="150" x2="292" y2="150" stroke="url(#arrowGrad)" stroke-width="3"/>
    <polygon points="292,142 306,150 292,158" fill="#e0a825"/>

    <!-- Node 2 -->
    <g>
      <rect x="300" y="70" width="220" height="160" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
      <circle cx="330" cy="100" r="20" fill="url(#badgeGrad)"/>
      <text x="330" y="106" font-size="18" font-weight="700" fill="#0a1628" text-anchor="middle">2</text>
      <text x="310" y="150" font-size="21" font-weight="700" fill="#eef2f8">Mesh Generation</text>
      <text x="310" y="178" font-size="13" fill="#9fb0c7">Tetrahedral mesh with</text>
      <text x="310" y="197" font-size="13" fill="#9fb0c7">5-layer boundary inflation</text>
    </g>
    <line x1="525" y1="150" x2="572" y2="150" stroke="url(#arrowGrad)" stroke-width="3"/>
    <polygon points="572,142 586,150 572,158" fill="#e0a825"/>

    <!-- Node 3 -->
    <g>
      <rect x="580" y="70" width="220" height="160" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
      <circle cx="610" cy="100" r="20" fill="url(#badgeGrad)"/>
      <text x="610" y="106" font-size="18" font-weight="700" fill="#0a1628" text-anchor="middle">3</text>
      <text x="590" y="150" font-size="21" font-weight="700" fill="#eef2f8">CFD Solve</text>
      <text x="590" y="178" font-size="13" fill="#9fb0c7">k-ε RANS +</text>
      <text x="590" y="197" font-size="13" fill="#9fb0c7">Conjugate Heat Transfer</text>
    </g>
    <line x1="805" y1="150" x2="852" y2="150" stroke="url(#arrowGrad)" stroke-width="3"/>
    <polygon points="852,142 866,150 852,158" fill="#e0a825"/>

    <!-- Node 4 -->
    <g>
      <rect x="860" y="70" width="220" height="160" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
      <circle cx="890" cy="100" r="20" fill="url(#badgeGrad)"/>
      <text x="890" y="106" font-size="18" font-weight="700" fill="#0a1628" text-anchor="middle">4</text>
      <text x="870" y="150" font-size="21" font-weight="700" fill="#eef2f8">Port Extraction</text>
      <text x="870" y="178" font-size="13" fill="#9fb0c7">Averaged T &amp; p at</text>
      <text x="870" y="197" font-size="13" fill="#9fb0c7">every inlet / outlet</text>
    </g>
    <line x1="1085" y1="150" x2="1132" y2="150" stroke="url(#arrowGrad)" stroke-width="3"/>
    <polygon points="1132,142 1146,150 1132,158" fill="#e0a825"/>

    <!-- Node 5 -->
    <g>
      <rect x="1140" y="70" width="220" height="160" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
      <circle cx="1170" cy="100" r="20" fill="url(#badgeGrad)"/>
      <text x="1170" y="106" font-size="18" font-weight="700" fill="#0a1628" text-anchor="middle">5</text>
      <text x="1150" y="150" font-size="21" font-weight="700" fill="#eef2f8">Hand Validation</text>
      <text x="1150" y="178" font-size="13" fill="#9fb0c7">Energy balance · LMTD</text>
      <text x="1150" y="197" font-size="13" fill="#9fb0c7">ε-NTU · Reynolds</text>
    </g>
    <line x1="1365" y1="150" x2="1412" y2="150" stroke="url(#arrowGrad)" stroke-width="3"/>
    <polygon points="1412,142 1426,150 1412,158" fill="#e0a825"/>

    <!-- Node 6 -->
    <g>
      <rect x="1420" y="70" width="220" height="160" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
      <circle cx="1450" cy="100" r="20" fill="url(#badgeGrad)"/>
      <text x="1450" y="106" font-size="18" font-weight="700" fill="#0a1628" text-anchor="middle">6</text>
      <text x="1430" y="150" font-size="21" font-weight="700" fill="#eef2f8">Report &amp; Slides</text>
      <text x="1430" y="178" font-size="13" fill="#9fb0c7">Auto-generated,</text>
      <text x="1430" y="197" font-size="13" fill="#9fb0c7">traceable to the model</text>
    </g>
  </g>
</svg>
