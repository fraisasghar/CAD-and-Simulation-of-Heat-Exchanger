<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#141227"/>
      <stop offset="100%" stop-color="#2b1250"/>
    </linearGradient>
    <linearGradient id="shellGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16304f"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </linearGradient>
    <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a825"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bgGrad3)"/>
  <g opacity="0.06">
    <pattern id="dots3" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff"/>
    </pattern>
    <rect width="1200" height="700" fill="url(#dots3)"/>
  </g>

  <text x="30" y="34" font-size="14" letter-spacing="2" fill="#e0a825" font-weight="700">MODEL COMPONENTS</text>

  <!-- Shell body -->
  <rect x="330" y="290" width="620" height="170" rx="85" fill="url(#shellGrad3)" stroke="#c2410c" stroke-width="3"/>

  <!-- Baffles -->
  <g stroke="#c98a1288" stroke-width="2">
    <rect x="410" y="290" width="9" height="80" fill="#4a1f7a77"/>
    <rect x="500" y="370" width="9" height="80" fill="#4a1f7a77"/>
    <rect x="590" y="290" width="9" height="80" fill="#4a1f7a77"/>
    <rect x="680" y="370" width="9" height="80" fill="#4a1f7a77"/>
    <rect x="770" y="290" width="9" height="80" fill="#4a1f7a77"/>
    <rect x="860" y="370" width="9" height="80" fill="#4a1f7a77"/>
  </g>

  <!-- Tube bundle centerline hint -->
  <line x1="330" y1="375" x2="950" y2="375" stroke="#e0a82555" stroke-width="3" stroke-dasharray="4 6"/>

  <!-- Nozzles - diagonally opposite -->
  <rect x="380" y="235" width="34" height="55" fill="url(#nozzleGrad)" rx="4"/>
  <rect x="866" y="460" width="34" height="55" fill="url(#nozzleGrad)" rx="4"/>

  <!-- End caps -->
  <rect x="315" y="290" width="15" height="170" fill="#0c1a2e" stroke="#8695ac" stroke-width="1.5"/>
  <rect x="950" y="290" width="15" height="170" fill="#0c1a2e" stroke="#8695ac" stroke-width="1.5"/>

  <!-- Tube bundle cross-section inset -->
  <circle cx="150" cy="375" r="82" fill="#0c1a2eaa" stroke="#5a6b85" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="150" cy="375" r="10" fill="#e0a825" stroke="#0c1a2e" stroke-width="2"/>
  <circle cx="150" cy="332" r="10" fill="#e0a825" stroke="#0c1a2e" stroke-width="2"/>
  <circle cx="187" cy="353" r="10" fill="#e0a825" stroke="#0c1a2e" stroke-width="2"/>
  <circle cx="187" cy="397" r="10" fill="#e0a825" stroke="#0c1a2e" stroke-width="2"/>
  <circle cx="150" cy="418" r="10" fill="#e0a825" stroke="#0c1a2e" stroke-width="2"/>
  <circle cx="113" cy="397" r="10" fill="#e0a825" stroke="#0c1a2e" stroke-width="2"/>
  <circle cx="113" cy="353" r="10" fill="#e0a825" stroke="#0c1a2e" stroke-width="2"/>
  <text x="150" y="480" font-size="13" fill="#c9902a" text-anchor="middle" font-weight="700">Tube Bundle Cross-Section</text>
  <text x="150" y="498" font-size="12" fill="#9fb0c7" text-anchor="middle">7 × ⌀10 mm · 30 mm triangular pitch</text>

  <!-- Leader lines + callout labels -->
  <!-- Shell -->
  <line x1="600" y1="290" x2="600" y2="120" stroke="#c2410c" stroke-width="1.5"/>
  <rect x="440" y="70" width="320" height="60" rx="10" fill="#12233dcc" stroke="#c2410c" stroke-width="1.5"/>
  <text x="600" y="94" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">Shell</text>
  <text x="600" y="114" font-size="12" fill="#9fb0c7" text-anchor="middle">70 mm OR · 608.5 mm length · 9 mm caps</text>

  <!-- Baffles -->
  <line x1="500" y1="450" x2="500" y2="565" stroke="#c98a12" stroke-width="1.5"/>
  <rect x="340" y="565" width="320" height="60" rx="10" fill="#12233dcc" stroke="#c98a12" stroke-width="1.5"/>
  <text x="500" y="589" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">Baffle Plates</text>
  <text x="500" y="609" font-size="12" fill="#9fb0c7" text-anchor="middle">6 segmental · 60 mm R · 80 mm pitch</text>

  <!-- Nozzles -->
  <line x1="883" y1="460" x2="990" y2="380" stroke="#e0a825" stroke-width="1.5"/>
  <rect x="850" y="330" width="290" height="60" rx="10" fill="#12233dcc" stroke="#e0a825" stroke-width="1.5"/>
  <text x="995" y="354" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">Nozzles</text>
  <text x="995" y="374" font-size="12" fill="#9fb0c7" text-anchor="middle">radial stubs, diagonally opposite ends</text>
</svg>
