<svg viewBox="0 0 1520 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#141227"/>
      <stop offset="100%" stop-color="#2b1250"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="80%" stop-color="#e0a825"/>
      <stop offset="100%" stop-color="#8b4fd1"/>
    </linearGradient>
    <linearGradient id="doneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a825"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="1520" height="380" fill="url(#bgGrad4)"/>
  <g opacity="0.06">
    <pattern id="dots4" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff"/>
    </pattern>
    <rect width="1520" height="380" fill="url(#dots4)"/>
  </g>

  <text x="30" y="34" font-size="14" letter-spacing="2" fill="#e0a825" font-weight="700">DEVELOPMENT ROADMAP</text>

  <!-- Baseline -->
  <line x1="100" y1="190" x2="1400" y2="190" stroke="url(#lineGrad)" stroke-width="4"/>

  <!-- Phase 1 -->
  <circle cx="100" cy="190" r="26" fill="url(#doneGrad)"/>
  <path d="M89,190 L97,199 L113,180" fill="none" stroke="#0a1628" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="245" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">Geometry &amp;</text>
  <text x="100" y="263" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">Parametric CAD</text>

  <!-- Phase 2 -->
  <circle cx="360" cy="190" r="26" fill="url(#doneGrad)"/>
  <path d="M349,190 L357,199 L373,180" fill="none" stroke="#0a1628" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="245" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">Mesh Generation</text>
  <text x="360" y="263" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">&amp; Validation</text>

  <!-- Phase 3 -->
  <circle cx="620" cy="190" r="26" fill="url(#doneGrad)"/>
  <path d="M609,190 L617,199 L633,180" fill="none" stroke="#0a1628" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="620" y="245" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">CFD Solve</text>
  <text x="620" y="263" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">k-ε + CHT</text>

  <!-- Phase 4 -->
  <circle cx="880" cy="190" r="26" fill="url(#doneGrad)"/>
  <path d="M869,190 L877,199 L893,180" fill="none" stroke="#0a1628" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="880" y="245" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">Field &amp; Port Data</text>
  <text x="880" y="263" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">Extraction</text>

  <!-- Phase 5 -->
  <circle cx="1140" cy="190" r="26" fill="url(#doneGrad)"/>
  <path d="M1129,190 L1137,199 L1153,180" fill="none" stroke="#0a1628" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1140" y="245" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">Hand Calculation</text>
  <text x="1140" y="263" font-size="14" fill="#e8edf5" text-anchor="middle" font-weight="700">Cross-Check</text>

  <!-- Phase 6 - next, highlighted -->
  <rect x="1290" y="55" width="120" height="30" rx="15" fill="#c2410c"/>
  <text x="1350" y="75" font-size="13" fill="#0a1628" text-anchor="middle" font-weight="700">NEXT UP</text>
  <circle cx="1400" cy="190" r="30" fill="none" stroke="#8b4fd1" stroke-width="4" stroke-dasharray="6 6"/>
  <text x="1400" y="197" font-size="18" fill="#a06ee0" text-anchor="middle" font-weight="700">6</text>
  <rect x="1230" y="230" width="280" height="90" rx="12" fill="#2b125055" stroke="#8b4fd1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="1370" y="256" font-size="15" fill="#c9a6ec" text-anchor="middle" font-weight="700">Parametric Sweep</text>
  <text x="1370" y="278" font-size="12" fill="#9fb0c7" text-anchor="middle">More baffles · tighter pitch</text>
  <text x="1370" y="296" font-size="12" fill="#9fb0c7" text-anchor="middle">longer shell — push ε past 49.3%</text>

  <!-- Legend -->
  <circle cx="120" cy="345" r="9" fill="url(#doneGrad)"/>
  <text x="140" y="350" font-size="13" fill="#9fb0c7">Complete</text>
  <circle cx="250" cy="345" r="9" fill="none" stroke="#8b4fd1" stroke-width="3" stroke-dasharray="3 3"/>
  <text x="270" y="350" font-size="13" fill="#9fb0c7">Planned</text>
</svg>
